<div
  class="align-items-center d-flex flex-wrap gap-2 justify-content-between mb-2"
>
  <div>
    <div class="h5 mb-0">Performance depuis l'achat</div>
    <div class="legend-date">{{ legendDate }}</div>
  </div>
  <div aria-label="Période" class="ranges" role="group">
    @for (r of ranges; track r.days) {
      <button
        type="button"
        [attr.aria-pressed]="range === r.days"
        (click)="onRange(r.days)"
      >
        {{ r.label }}
      </button>
    }
  </div>
</div>
@if (legend.length > 0) {
  <div class="legend mb-2">
    @for (item of legend; track item.name; let i = $index) {
      <button
        class="legend-item"
        type="button"
        [attr.aria-pressed]="item.visible"
        [class.hidden-series]="!item.visible"
        (click)="onToggle(i)"
      >
        <span
          class="swatch"
          [class.portfolio]="item.isPortfolio"
          [style.background]="item.color"
        ></span>
        <span class="text-body-secondary">{{ item.name }}</span>
        <b [class]="valueClass(item.value)">{{ formatPercent(item.value) }}</b>
      </button>
    }
  </div>
}
<div class="chart-container">
  @if (isLoading()) {
    <ngx-skeleton-loader
      animation="pulse"
      [theme]="{ height: '100%', width: '100%' }"
    />
  } @else if (legend.length === 0) {
    <p class="py-5 text-body-secondary text-center">
      Aucune position détenue pour l'instant.
    </p>
  }
  <div
    #chartContainer
    aria-label="Performance en pourcentage depuis la date d'achat de chaque position et du portefeuille"
    class="chart"
    role="img"
    [class.d-none]="isLoading() || legend.length === 0"
  ></div>
</div>
