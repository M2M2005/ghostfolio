<gf-dialog-header
  position="center"
  [deviceType]="data.deviceType"
  [title]="assetProfile?.name ?? assetProfile?.symbol"
  (closeButtonClicked)="onClose()"
/>

<div class="flex-grow-1" mat-dialog-content>
  <div class="container p-0">
    @if (potentialMedian !== undefined) {
      <!-- bourse-custom : critère d'achat mis en avant -->
      <div class="d-flex justify-content-center mb-3">
        <div class="potential" [class]="percentClass(potentialMedian)">
          <span class="potential-label"
            >Potentiel jusqu'à l'objectif médian</span
          >
          <span class="potential-value">{{
            formatPercent(potentialMedian)
          }}</span>
        </div>
      </div>
    }

    @if (isLoading) {
      <ngx-skeleton-loader
        animation="pulse"
        [theme]="{ height: '360px', width: '100%' }"
      />
    } @else {
      <gf-asset-price-chart
        class="mb-3"
        [colorScheme]="data.colorScheme"
        [currency]="assetProfile?.currency"
        [locale]="data.locale"
        [points]="points"
        [purchase]="purchase"
        [targetLines]="targetLines"
      />
    }

    <div class="stats mb-2">
      @for (stat of stats; track stat.label) {
        <div class="stat">
          <div class="stat-label">{{ stat.label }}</div>
          @if (stat.text !== undefined) {
            <div class="stat-value">{{ stat.text }}</div>
          } @else {
            <div class="stat-value" [class]="percentClass(stat.percent)">
              {{ formatPercent(stat.percent) }}
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>

<gf-dialog-footer
  [deviceType]="data.deviceType"
  (closeButtonClicked)="onClose()"
/>
